name: ANS V2 Demo contract checks
on:
  push:
    branches: [v2-baseline-recovery-dev]
  workflow_dispatch:
jobs:
  demo-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Demo-only source syntax
        run: |
          for f in development/*.mjs; do node --check "$f"; done
      - name: Run isolated Demo contract tests (no credentials or orders)
        run: node --test development/*.test.mjs
